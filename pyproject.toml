[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paraguibench"
version = "0.1.0.dev0"
description = "A benchmark and execution framework for parallel GUI agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "ParaGUIBench Authors" },
]
dependencies = []

[project.optional-dependencies]
live = [
  "openai>=1.82,<3",
  "Pillow>=11,<13",
  "requests>=2.32,<3",
  "playwright>=1.50,<2",
]
operation = [
  "openpyxl>=3.1.5,<4",
  "python-docx>=1.1.2,<2",
  "python-pptx>=1.0.2,<2",
  "Pillow>=11,<13",
]
artifact = [
  "openpyxl>=3.1.5,<4",
  "python-docx>=1.1.2,<2",
  "python-pptx>=1.0.2,<2",
  "Pillow>=11,<13",
  "pypdf>=5,<7",
]
methods = [
  "openai>=1.82,<3",
  "Pillow>=11,<13",
  "requests>=2.32,<3",
  "numpy>=1.26,<3",
  "tqdm>=4.65,<5",
  "pandas>=2.2,<3",
  "psutil>=5.9,<8",
  "filelock>=1,<4",
  "docker>=7,<8",
]
onlyoffice = [
  "flask>=3,<4",
  "gunicorn>=22,<24",
  "requests>=2.32,<3",
]
dev = [
  "pytest>=8.3,<9",
  "openpyxl>=3.1.5,<4",
  "python-docx>=1.1.2,<2",
]

[project.scripts]
paraguibench = "paraguibench.cli.main:main"
paraguibench-methods = "paraguibench.methods_runner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/paraguibench",
  "src/parallel_benchmark",
  "src/desktop_env",
  "src/pipelines",
  "src/mm_agents",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
