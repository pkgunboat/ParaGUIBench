[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paraguibench"
version = "0.2.0.dev0"
description = "A benchmark and execution framework for parallel GUI agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "ParaGUIBench Authors" },
]
dependencies = []

[project.optional-dependencies]
live = [
  "openai>=1.82,<3",
  "Pillow>=11,<13",
  "requests>=2.32,<3",
  "playwright>=1.50,<2",
]
operation = [
  "openpyxl>=3.1.5,<4",
  "python-docx>=1.1.2,<2",
  "python-pptx>=1.0.2,<2",
  "Pillow>=11,<13",
]
artifact = [
  "openpyxl>=3.1.5,<4",
  "python-docx>=1.1.2,<2",
  "python-pptx>=1.0.2,<2",
  "Pillow>=11,<13",
  "pypdf>=5,<7",
]
methods = [
  "openai>=1.82,<3",
  "Pillow>=11,<13",
  "requests>=2.32,<3",
  "numpy>=1.26,<3",
  "tqdm>=4.65,<5",
  "pandas>=2.2,<3",
  "psutil>=5.9,<8",
  "filelock>=1,<4",
  "docker>=7,<8",
  "pyyaml>=6,<7",
  "rapidfuzz>=3,<4",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "formulas>=1.2,<2",
  "cssselect>=1.2,<2",
  "xmltodict>=0.13,<1",
  "pymupdf>=1.24,<2",
  "borb>=2.1,<3",
  "odfpy>=1.4,<2",
  "scikit-image>=0.22,<1",
  "pdfplumber>=0.11,<1",
  "opencv-python-headless>=4.9,<5",
  "mutagen>=1.47,<2",
  "pypdf>=5,<7",
  "pyacoustid>=1.3,<2",
  "imagehash>=4.3,<5",
  "librosa>=0.10,<1",
  "soundfile>=0.12,<1",
  "fastdtw>=0.3,<1",
  "PyPDF2>=3,<4",
]
onlyoffice = [
  "flask>=3,<4",
  "gunicorn>=22,<24",
  "requests>=2.32,<3",
]
dev = [
  "pytest>=8.3,<9",
  "openpyxl>=3.1.5,<4",
  "python-docx>=1.1.2,<2",
]

[project.scripts]
paraguibench = "paraguibench.cli.main:main"
paraguibench-methods = "paraguibench.methods_runner.__main__:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/paraguibench",
  "src/parallel_benchmark",
  "src/desktop_env",
  "src/pipelines",
  "src/mm_agents",
  "src/stages",
]

[tool.hatch.build.targets.wheel.force-include]
"src/config_loader.py" = "config_loader.py"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
