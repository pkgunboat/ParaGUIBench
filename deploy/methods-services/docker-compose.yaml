networks:
  default:
    name: bench-net

# 显式写 name: 固定卷名，避免 compose 根据 project dir 追加 `docker_` 前缀。
# WebMall 数据使用本机既有的完整 woocommerce_* 卷。
volumes:
  webmall_esdata:
    name: webmall_esdata
    driver: local
  webmall_mariadb_shop1:
    name: woocommerce_mariadb_data_shop1
    external: true
  webmall_mariadb_shop2:
    name: woocommerce_mariadb_data_shop2
    external: true
  webmall_mariadb_shop3:
    name: woocommerce_mariadb_data_shop3
    external: true
  webmall_mariadb_shop4:
    name: woocommerce_mariadb_data_shop4
    external: true
  webmall_wordpress_shop1:
    name: woocommerce_wordpress_data_shop1
    external: true
  webmall_wordpress_shop2:
    name: woocommerce_wordpress_data_shop2
    external: true
  webmall_wordpress_shop3:
    name: woocommerce_wordpress_data_shop3
    external: true
