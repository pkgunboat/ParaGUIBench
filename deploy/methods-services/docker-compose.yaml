# ─────────────────────────────────────────────────────────────
# ParaGUIBench 外部服务编排
#   - OnlyOffice DocumentServer：SearchWrite pipeline 依赖
#   - Flask 文档共享服务：封装 OnlyOffice 的任务级共享链接
#   - WebMall 商城（4 个 WordPress+WooCommerce 店铺）：WebMall pipeline 依赖
# ─────────────────────────────────────────────────────────────
# 用法（首次部署）：
#     bash scripts/deployment/setup_webmall_services.sh   # 恢复备份数据 + 初始化
#     bash scripts/deployment/start_bench_services.sh     # 启动所有服务
#
# 用法（后续启动）：
#     bash scripts/deployment/start_bench_services.sh
#     bash scripts/deployment/stop_bench_services.sh
#
# 所有端口来自 configs/deploy.yaml 的 services.*，由 start_bench_services.sh
# 通过 Python 解析后导出为环境变量。
# ─────────────────────────────────────────────────────────────

services:
  # ═══════════════════════════════════════════════════════════
  # OnlyOffice 文档编辑服务
  # ═══════════════════════════════════════════════════════════

  onlyoffice:
    image: onlyoffice/documentserver:8.1
    container_name: bench-onlyoffice
    restart: unless-stopped
    # 资源上限：防止 RTC 协同满载时挤占 qemu VM 容器内存
    mem_limit: 4g
    cpus: 4
    ports:
      - "${ONLYOFFICE_DOC_PORT:-8080}:80"
    environment:
      - JWT_ENABLED=false
      - ALLOW_PRIVATE_IP_ADDRESS=true
    volumes:
      - ./onlyoffice/data:/var/www/onlyoffice/Data
      - ./onlyoffice/logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  onlyoffice-share:
    image: python:3.11-slim
    container_name: bench-onlyoffice-share
    restart: unless-stopped
    depends_on:
      - onlyoffice
    ports:
      - "${ONLYOFFICE_FLASK_PORT:-5050}:5050"
    working_dir: /app
    volumes:
      - ./onlyoffice:/app
      - ./onlyoffice/shared_documents:/app/shared_documents
    environment:
      - HOST_IP=${ONLYOFFICE_HOST_IP:-127.0.0.1}
      - DOC_SERVER_PORT=${ONLYOFFICE_DOC_PORT:-8080}
      - FLASK_PORT=5050
      - DOC_FETCH_HOST=${ONLYOFFICE_FETCH_HOST:-bench-onlyoffice-share}
      - DOC_FETCH_PORT=5050
      - ONLYOFFICE_JWT_ENABLED=${ONLYOFFICE_JWT_ENABLED:-false}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
    # gunicorn 单 worker 多线程：JSON 状态文件用进程内锁保护，
    # 必须保持单 worker（多 worker 会把竞态恶化为进程级）；
    # 依赖 pin 主版本，避免上游 breaking change 静默炸
    command:
      - sh
      - -c
      - mkdir -p /app/shared_documents && chmod 0777 /app/shared_documents && pip install --no-cache-dir 'flask>=3,<4' 'requests>=2,<3' 'gunicorn>=22,<24' python-docx openpyxl python-pptx && gunicorn -w 1 --threads 16 --timeout 120 -b 0.0.0.0:5050 document_sharing_server:app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5050/healthz', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── OnlyOffice 实例 2/3（多实例部署，profile 控制） ─────────
  # 启用方式：docker compose --profile onlyoffice-multi up -d
  # （start_bench_services.sh 根据 deploy.yaml services.onlyoffice.instances 自动启用）
  # 每套实例独立的数据目录（文档/共享链接/协作 key 互不串扰），
  # stage0 按任务轮转把文档路由到不同实例，绕开 DocumentServer
  # 社区版 ~20 并发编辑连接的许可上限。

  onlyoffice-2:
    image: onlyoffice/documentserver:8.1
    container_name: bench-onlyoffice-2
    restart: unless-stopped
    profiles: ["onlyoffice-multi"]
    mem_limit: 4g
    cpus: 4
    ports:
      - "${ONLYOFFICE_DOC_PORT_2:-8081}:80"
    environment:
      - JWT_ENABLED=false
      - ALLOW_PRIVATE_IP_ADDRESS=true
    volumes:
      - ./onlyoffice/data_2:/var/www/onlyoffice/Data
      - ./onlyoffice/logs_2:/var/log/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  onlyoffice-share-2:
    image: python:3.11-slim
    container_name: bench-onlyoffice-share-2
    restart: unless-stopped
    profiles: ["onlyoffice-multi"]
    depends_on:
      - onlyoffice-2
    ports:
      - "${ONLYOFFICE_FLASK_PORT_2:-5051}:5050"
    working_dir: /app
    volumes:
      - ./onlyoffice:/app
      - ./onlyoffice/instance_2:/app/instance_data
    environment:
      - HOST_IP=${ONLYOFFICE_HOST_IP:-127.0.0.1}
      - DOC_SERVER_PORT=${ONLYOFFICE_DOC_PORT_2:-8081}
      - FLASK_PORT=5050
      - DOC_FETCH_HOST=bench-onlyoffice-share-2
      - DOC_FETCH_PORT=5050
      - ONLYOFFICE_JWT_ENABLED=${ONLYOFFICE_JWT_ENABLED:-false}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ONLYOFFICE_SHARE_DATA_DIR=/app/instance_data
    command:
      - sh
      - -c
      - mkdir -p /app/instance_data/shared_documents && chmod -R 0777 /app/instance_data && pip install --no-cache-dir 'flask>=3,<4' 'requests>=2,<3' 'gunicorn>=22,<24' python-docx openpyxl python-pptx && gunicorn -w 1 --threads 16 --timeout 120 -b 0.0.0.0:5050 document_sharing_server:app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5050/healthz', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  onlyoffice-3:
    image: onlyoffice/documentserver:8.1
    container_name: bench-onlyoffice-3
    restart: unless-stopped
    profiles: ["onlyoffice-multi"]
    mem_limit: 4g
    cpus: 4
    ports:
      - "${ONLYOFFICE_DOC_PORT_3:-8082}:80"
    environment:
      - JWT_ENABLED=false
      - ALLOW_PRIVATE_IP_ADDRESS=true
    volumes:
      - ./onlyoffice/data_3:/var/www/onlyoffice/Data
      - ./onlyoffice/logs_3:/var/log/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  onlyoffice-share-3:
    image: python:3.11-slim
    container_name: bench-onlyoffice-share-3
    restart: unless-stopped
    profiles: ["onlyoffice-multi"]
    depends_on:
      - onlyoffice-3
    ports:
      - "${ONLYOFFICE_FLASK_PORT_3:-5052}:5050"
    working_dir: /app
    volumes:
      - ./onlyoffice:/app
      - ./onlyoffice/instance_3:/app/instance_data
    environment:
      - HOST_IP=${ONLYOFFICE_HOST_IP:-127.0.0.1}
      - DOC_SERVER_PORT=${ONLYOFFICE_DOC_PORT_3:-8082}
      - FLASK_PORT=5050
      - DOC_FETCH_HOST=bench-onlyoffice-share-3
      - DOC_FETCH_PORT=5050
      - ONLYOFFICE_JWT_ENABLED=${ONLYOFFICE_JWT_ENABLED:-false}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      - ONLYOFFICE_SHARE_DATA_DIR=/app/instance_data
    command:
      - sh
      - -c
      - mkdir -p /app/instance_data/shared_documents && chmod -R 0777 /app/instance_data && pip install --no-cache-dir 'flask>=3,<4' 'requests>=2,<3' 'gunicorn>=22,<24' python-docx openpyxl python-pptx && gunicorn -w 1 --threads 16 --timeout 120 -b 0.0.0.0:5050 document_sharing_server:app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5050/healthz', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ═══════════════════════════════════════════════════════════
  # WebMall 商城服务
  # 每个店铺 = MariaDB + WordPress(WooCommerce)，共享 Elasticsearch
  # 端口 9081-9084 分别对应 shop 1-4
  # ═══════════════════════════════════════════════════════════

  webmall-frontend:
    image: nginx:latest
    container_name: bench-webmall-frontend
    restart: unless-stopped
    ports:
      - "${WEBMALL_FRONTEND_PORT:-8090}:80"
    volumes:
      - ./webmall/index.html:/usr/share/nginx/html/index.html:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: bench-webmall-es
    restart: unless-stopped
    # 大并发调优：4 店共享单实例，512m heap 在 60-100 并发浏览会话下
    # 偏紧；heap 提到 1g 并设容器上限，防止与 qemu VM 容器互抢内存
    mem_limit: 2g
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - webmall_esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Shop 1 ──────────────────────────────────────────────
  mariadb-shop1:
    image: bitnami/mariadb:latest
    container_name: bench-mariadb-1
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${WEBMALL_DB_ROOT_PASSWORD:-rootpassword}
      - MARIADB_USER=bn_wordpress
      - MARIADB_PASSWORD=${WEBMALL_DB_PASSWORD:-wordpress_db_password}
      - MARIADB_DATABASE=bitnami_wordpress
      # 大并发调优：bitnami 默认 max_connections=151 与 Apache 默认
      # 150 worker 顶格，并发浏览会话多时会连锁排队
      - MARIADB_EXTRA_FLAGS=--max_connections=300 --innodb_buffer_pool_size=512M
    volumes:
      - webmall_mariadb_shop1:/bitnami/mariadb
    networks:
      default:
        aliases:
          - mariadb_shop1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bn_wordpress", "-p${WEBMALL_DB_PASSWORD:-wordpress_db_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  wordpress-shop1:
    image: bitnami/wordpress:latest
    container_name: bench-wordpress-1
    restart: unless-stopped
    depends_on:
      mariadb-shop1:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "${WEBMALL_PORT_1:-9081}:8080"
    environment:
      WORDPRESS_DATABASE_HOST: mariadb-shop1
      WORDPRESS_DATABASE_USER: bn_wordpress
      WORDPRESS_DATABASE_PASSWORD: ${WEBMALL_DB_PASSWORD:-wordpress_db_password}
      WORDPRESS_DATABASE_NAME: bitnami_wordpress
      WORDPRESS_USERNAME: ${WEBMALL_ADMIN_USER:-admin}
      WORDPRESS_PASSWORD: ${WEBMALL_ADMIN_PASSWORD:-admin}
      WORDPRESS_EMAIL: user@example.com
      WORDPRESS_CONFIG_EXTRA: |
        define('EP_HOST','http://elasticsearch:9200');
        define('EP_INDEX_PREFIX','shop1_');
    volumes:
      - webmall_wordpress_shop1:/bitnami/wordpress
      - ./webmall/fix_urls.sh:/usr/local/bin/fix_urls.sh:ro
      - ./webmall/fix_urls_deploy.sh:/usr/local/bin/fix_urls_deploy.sh:ro
    healthcheck:
      test: ["CMD", "wp", "core", "is-installed", "--path=/opt/bitnami/wordpress"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

